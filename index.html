<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Voice Capture & Translation (China Compatible)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121827;
            --card-border: #1f293d;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --btn-pink: #be123c;
            --btn-blue: #1d4ed8;
            --btn-dual: #0f766e;
            
            /* Terminal-style colors */
            --orange-tag: #d97706;
            --green-target: #4ade80;
            --source-grey: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-group {
            display: flex;
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .control-btn {
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 16px 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            min-height: 100px;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .btn-chinese { background: var(--btn-pink); }
        .btn-english { background: var(--btn-blue); }
        .btn-dual { background: var(--btn-dual); }

        .control-btn:hover {
            opacity: 1;
        }

        .control-btn.active {
            opacity: 1;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            border: 2px solid #ffffff;
            transform: scale(1.02);
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            resize: none;
            outline: none;
            font-size: 0.95rem;
        }

        textarea:focus {
            border-color: var(--accent-blue);
        }

        .full-width-btn {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-container {
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .indicator {
            width: 100px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .indicator.active {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .toggle-row {
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .translation-display {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 16px;
            min-height: 280px;
        }

        @media (max-width: 600px) {
            .translation-display {
                grid-template-columns: 1fr;
            }
        }

        .display-box {
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            min-height: 250px;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .box-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .icon-btn:hover {
            color: var(--text-main);
        }

        .box-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            flex: 1;
            min-height: 180px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        }

        .translation-entry {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detection-tag {
            color: var(--orange-tag);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .source-line {
            color: var(--source-grey);
            font-size: 0.95rem;
        }

        .target-line {
            color: var(--green-target);
            font-size: 1rem;
        }

        .interim-text {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="tab-group">
            <button id="tabSpeech" class="tab-btn active">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <span id="labelTabSpeech">Speech-Based</span>
            </button>
            <button id="tabText" class="tab-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span id="labelTabText">Text</span>
            </button>
        </div>

        <div class="top-actions">
            <button id="translateUiBtn" class="action-btn primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
                <span id="labelTranslateUi">Translate UI</span>
            </button>
            <button id="clearAllBtn" class="action-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span id="labelClearAll">Clear All</span>
            </button>
        </div>
    </header>

    <div class="workspace-grid">
        <div class="card">
            <div class="card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <span id="labelVoiceControls">Voice Input Controls</span>
            </div>

            <div id="speechControls" class="mode-buttons">
                <button id="listenZhBtn" class="control-btn btn-chinese">Listen Chinese</button>
                <button id="listenEnBtn" class="control-btn btn-english">Listen English</button>
                <button id="autoDualBtn" class="control-btn btn-dual">Auto Dual<br>(EN + ZH)</button>
            </div>

            <div id="textControls" style="display: none;">
                <textarea id="inputText" placeholder="Type text here..."></textarea>
                <button id="translateManualBtn" class="full-width-btn" style="margin-top: 12px;">Translate Text</button>
            </div>

            <div class="status-container">
                <div id="statusIndicator" class="indicator"></div>
                <span id="statusText">READY & AWAITING INPUT</span>
            </div>

            <div class="toggle-row">
                <span id="labelAutoRead">Auto-read translation aloud</span>
                <label class="switch">
                    <input type="checkbox" id="autoSpeakCheckbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
                <span id="labelOutputTitle">Translation Output</span>
            </div>

            <div class="translation-display">
                <div class="display-box">
                    <div class="box-header">
                        <span id="sourceTitle">Real-Time Input</span>
                        <div class="box-actions">
                            <button id="copySourceBtn" class="icon-btn" title="Copy">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div id="sourceText" class="box-content"></div>
                </div>

                <div class="display-box">
                    <div class="box-header">
                        <span id="targetTitle">Detected Log</span>
                        <div class="box-actions">
                            <button id="copyTargetBtn" class="icon-btn" title="Copy">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div id="targetLog" class="box-content"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
"use strict";

function decodeHTMLEntities(text) {
    if (!text) return "";
    const txt = document.createElement("textarea");
    txt.innerHTML = text;
    return txt.value;
}

// --- Translation Engine with Primary China-Accessible Endpoint ---
async function translateText(text, srcLang = "en", tgtLang = "zh") {
    if (!text || !text.trim()) return { translatedText: "" };

    const cleanSrc = srcLang === "auto" ? "autodetect" : srcLang;
    const cleanTgt = tgtLang.startsWith("zh") ? "zh" : tgtLang;

    // Primary: MyMemory Translation Engine (Accessible in China)
    try {
        const res = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${cleanSrc}|${cleanTgt}`
        );
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
            return { translatedText: decodeHTMLEntities(data.responseData.translatedText) };
        }
    } catch (err) {
        console.warn("MyMemory API failed, trying fallback:", err);
    }

    // Fallback Endpoint
    try {
        const response = await fetch(
            `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${cleanSrc}&tl=${cleanTgt}&dt=t&q=${encodeURIComponent(text)}`
        );
        const data = await response.json();
        if (data && data[0]) {
            const rawTranslation = data[0].map(item => item[0]).join("");
            return { translatedText: decodeHTMLEntities(rawTranslation) };
        }
    } catch (err) {
        console.error("Secondary Translation API failed:", err);
    }

    return { translatedText: decodeHTMLEntities(text) };
}

// --- UI Elements ---
const tabSpeech = document.getElementById("tabSpeech");
const tabText = document.getElementById("tabText");
const speechControls = document.getElementById("speechControls");
const textControls = document.getElementById("textControls");

const listenZhBtn = document.getElementById("listenZhBtn");
const listenEnBtn = document.getElementById("listenEnBtn");
const autoDualBtn = document.getElementById("autoDualBtn");

const sourceText = document.getElementById("sourceText");
const targetLog = document.getElementById("targetLog");
const inputText = document.getElementById("inputText");
const autoSpeakCheckbox = document.getElementById("autoSpeakCheckbox");
const statusIndicator = document.getElementById("statusIndicator");
const statusText = document.getElementById("statusText");
const translateUiBtn = document.getElementById("translateUiBtn");

let accumulatedSource = "";

function appendTranslationEntry(srcLangLabel, tgtLangLabel, originalText, translatedText) {
    const entryDiv = document.createElement("div");
    entryDiv.className = "translation-entry";

    const tagDiv = document.createElement("div");
    tagDiv.className = "detection-tag";
    tagDiv.textContent = `Detected: ${srcLangLabel} \u2192 ${tgtLangLabel}`;

    const srcDiv = document.createElement("div");
    srcDiv.className = "source-line";
    srcDiv.textContent = originalText;

    const tgtDiv = document.createElement("div");
    tgtDiv.className = "target-line";
    tgtDiv.textContent = translatedText;

    entryDiv.appendChild(tagDiv);
    entryDiv.appendChild(srcDiv);
    entryDiv.appendChild(tgtDiv);

    targetLog.appendChild(entryDiv);
    targetLog.scrollTop = targetLog.scrollHeight;
}

// --- Speech Recognition Setup ---
let recognition = null;
let currentListenMode = null;
let isUiChinese = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
        statusIndicator.classList.add("active");
        statusText.textContent = "LISTENING LIVE...";
    };

    recognition.onresult = async (event) => {
        let currentSessionFinal = '';
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                currentSessionFinal += event.results[i][0].transcript + " ";
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }

        const fullSourceDisplay = (accumulatedSource + " " + currentSessionFinal).trim();
        if (interimTranscript) {
            sourceText.innerHTML = `${fullSourceDisplay} <span class="interim-text">${interimTranscript}</span>`;
        } else {
            sourceText.textContent = fullSourceDisplay;
        }

        if (currentSessionFinal.trim()) {
            const transcript = currentSessionFinal.trim();
            accumulatedSource = fullSourceDisplay;

            const containsChinese = /[\u4e00-\u9fa5]/.test(transcript);
            let srcLang = "en";
            let tgtLang = "zh";

            if (currentListenMode === "zh") {
                srcLang = "zh";
                tgtLang = "en";
            } else if (currentListenMode === "en") {
                srcLang = "en";
                tgtLang = "zh";
            } else {
                srcLang = containsChinese ? "zh" : "en";
                tgtLang = containsChinese ? "en" : "zh";
            }

            statusText.textContent = "TRANSLATING...";
            const res = await translateText(transcript, srcLang, tgtLang);
            
            if (res.translatedText) {
                const srcLabel = srcLang === "zh" ? "Chinese" : "English";
                const tgtLabel = tgtLang === "zh" ? "Chinese" : "English";
                appendTranslationEntry(srcLabel, tgtLabel, transcript, res.translatedText);
            }
            
            statusText.textContent = "LISTENING LIVE...";

            if (autoSpeakCheckbox.checked && res.translatedText) {
                speakText(res.translatedText, tgtLang === "zh" ? "zh-CN" : "en-US");
            }
        }

        sourceText.scrollTop = sourceText.scrollHeight;
    };

    recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        if (event.error === 'network') {
            statusText.textContent = "NETWORK ERROR (PLEASE USE MICROSOFT EDGE OR SAFARI)";
        } else {
            statusText.textContent = "ERROR: " + event.error.toUpperCase();
        }
    };

    recognition.onend = () => {
        if (currentListenMode) {
            try { recognition.start(); } catch (e) {}
        } else {
            statusIndicator.classList.remove("active");
            statusText.textContent = "READY & AWAITING INPUT";
        }
    };
} else {
    statusText.textContent = "SPEECH RECOGNITION NOT SUPPORTED";
}

// --- Mode Controls ---
function setActiveListenMode(mode, button, langCode) {
    if (currentListenMode === mode) {
        currentListenMode = null;
        button.classList.remove("active");
        if (recognition) recognition.stop();
        statusIndicator.classList.remove("active");
        statusText.textContent = "READY & AWAITING INPUT";
        return;
    }

    [listenZhBtn, listenEnBtn, autoDualBtn].forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    currentListenMode = mode;

    if (recognition) {
        recognition.stop();
        recognition.lang = langCode;
        setTimeout(() => {
            try { recognition.start(); } catch (e) {}
        }, 200);
    }
}

listenZhBtn.addEventListener("click", () => setActiveListenMode("zh", listenZhBtn, "zh-CN"));
listenEnBtn.addEventListener("click", () => setActiveListenMode("en", listenEnBtn, "en-US"));
autoDualBtn.addEventListener("click", () => setActiveListenMode("dual", autoDualBtn, "en-US"));

tabSpeech.addEventListener("click", () => {
    tabSpeech.classList.add("active");
    tabText.classList.remove("active");
    speechControls.style.display = "grid";
    textControls.style.display = "none";
});

tabText.addEventListener("click", () => {
    tabText.classList.add("active");
    tabSpeech.classList.remove("active");
    speechControls.style.display = "none";
    textControls.style.display = "block";

    if (currentListenMode) {
        currentListenMode = null;
        [listenZhBtn, listenEnBtn, autoDualBtn].forEach(btn => btn.classList.remove("active"));
        if (recognition) recognition.stop();
        statusIndicator.classList.remove("active");
        statusText.textContent = "READY & AWAITING INPUT";
    }
});

// --- Text Input Translation ---
document.getElementById("translateManualBtn").addEventListener("click", async () => {
    const text = inputText.value.trim();
    if (!text) return;

    statusText.textContent = "TRANSLATING...";
    
    accumulatedSource = (accumulatedSource + " " + text).trim();
    sourceText.textContent = accumulatedSource;
    
    const isChinese = /[\u4e00-\u9fa5]/.test(text);
    const srcLang = isChinese ? "zh" : "en";
    const tgtLang = isChinese ? "en" : "zh";

    const res = await translateText(text, srcLang, tgtLang);
    
    if (res.translatedText) {
        const srcLabel = isChinese ? "Chinese" : "English";
        const tgtLabel = isChinese ? "English" : "Chinese";
        appendTranslationEntry(srcLabel, tgtLabel, text, res.translatedText);
    }
    
    statusText.textContent = "READY & AWAITING INPUT";
    inputText.value = "";

    if (autoSpeakCheckbox.checked && res.translatedText) {
        speakText(res.translatedText, isChinese ? "en-US" : "zh-CN");
    }

    sourceText.scrollTop = sourceText.scrollHeight;
});

// --- UI Translation Action ---
translateUiBtn.addEventListener("click", () => {
    isUiChinese = !isUiChinese;

    document.getElementById("labelTabSpeech").textContent = isUiChinese ? "语音模式" : "Speech-Based";
    document.getElementById("labelTabText").textContent = isUiChinese ? "文本模式" : "Text";
    document.getElementById("labelTranslateUi").textContent = isUiChinese ? "界面翻译" : "Translate UI";
    document.getElementById("labelClearAll").textContent = isUiChinese ? "清空全部" : "Clear All";
    document.getElementById("labelVoiceControls").textContent = isUiChinese ? "语音输入控制" : "Voice Input Controls";
    document.getElementById("labelOutputTitle").textContent = isUiChinese ? "翻译输出" : "Translation Output";
    document.getElementById("labelAutoRead").textContent = isUiChinese ? "自动朗读翻译文本" : "Auto-read translation aloud";

    listenZhBtn.textContent = isUiChinese ? "监听中文" : "Listen Chinese";
    listenEnBtn.textContent = isUiChinese ? "监听英文" : "Listen English";
    autoDualBtn.innerHTML = isUiChinese ? "双语自动<br>(中 + 英)" : "Auto Dual<br>(EN + ZH)";
});

// --- Helper Functions ---
function speakText(text, lang) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    window.speechSynthesis.speak(utterance);
}

document.getElementById("clearAllBtn").addEventListener("click", () => {
    inputText.value = "";
    sourceText.textContent = "";
    targetLog.innerHTML = "";
    accumulatedSource = "";
});

document.getElementById("copySourceBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(sourceText.textContent);
});

document.getElementById("copyTargetBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(targetLog.innerText);
});
</script>
